name: Build watch faces

# Every push to main publishes the APKs to the rolling "latest" release.
# Pushing a tag like v1.2 publishes a normal, permanent release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate watch face XML against the official WFF schema
        run: |
          pip install --quiet "xmlschema==4.3.2"
          python3 tools/validate_wff.py

      - name: Check generated faces are up to date
        run: |
          for gen in faces/*/design/gen_watchface.py; do
            [ -e "$gen" ] || continue
            face=$(dirname "$(dirname "$gen")")
            python3 "$gen" | diff -u "$face/src/main/res/raw/watchface.xml" - \
              || { echo "::error::$face: watchface.xml is stale, re-run $gen"; exit 1; }
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Use private signing key if configured
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the private keystore from secrets"
          else
            echo "Signing with signing/sideload.keystore (fine for sideloading, not for Play)"
          fi

      - name: Build release APKs
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          # Empty secrets would override the defaults in build.gradle.kts, so drop them.
          for v in SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            [ -n "${!v}" ] || unset "$v"
          done
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          for props in faces/*/face.properties; do
            face=$(basename "$(dirname "$props")")
            ver=$(grep -E '^versionName=' "$props" | cut -d= -f2-)
            apk="faces/$face/build/outputs/apk/release/$face-release.apk"
            cp "$apk" "dist/$face-$ver.apk"
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: watch-faces-apks
          path: dist/*.apk

      - name: Publish rolling "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.apk --prerelease --target "$GITHUB_SHA" \
            --title "Latest build (#${{ github.run_number }})" \
            --notes "Built from ${GITHUB_SHA::7}. Download an APK on your phone and install it on the watch with Bugjaeger or Wear Installer 2 (see README)."

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk --title "$GITHUB_REF_NAME" --generate-notes
